name: Build i deploy

# Statička stranica (nginx): nema Node buildu, ali build ostaje na GitHub
# Actionsu da VPS samo povuče gotov image.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Ne dozvoli da se dva deploya preklope ako se pushne brzo zaredom.
    concurrency: deploy-vps

    steps:
      # Ključ na serveru je ograničen (command= u authorized_keys): bez
      # obzira šta pošaljemo, server izvrši samo pull + up -d za OPG Anđelić.
      - name: Povuci novi image na VPS-u
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}

      - name: Provjeri da stranica odgovara
        run: |
          # [PROVJERITI s naručiteljem] adresa za health check
          for i in 1 2 3 4 5 6; do
            curl -fsS -o /dev/null https://opg-andjelic.31.97.183.143.sslip.io/tradicija/ && exit 0
            sleep 5
          done
          exit 1
