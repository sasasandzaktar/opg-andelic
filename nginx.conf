# Konfiguracija za statičku stranicu OPG Anđelić (kopira se u image, vidi Dockerfile).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Iza Caddyja: preusmjeravanja (npr. /tradicija -> /tradicija/) neka budu relativna
    absolute_redirect off;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml text/xml;

    # Demo: tražilice ne smiju indeksirati. Za pravu stranicu OBRISATI sve retke s X-Robots-Tag.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ =404;
        # HTML se uvijek provjerava, da izmjene budu odmah vidljive
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Slike, CSS, JS: dugi cache
    location ~* \.(?:webp|jpg|jpeg|png|svg|ico|css|js|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }
}
